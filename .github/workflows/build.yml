name: build
on:
  push:
    branches: [nuvem-v2, ccr-f1bf92dd-we61zz]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug -PvcRun=${{ github.run_number }} --stacktrace --no-daemon
      - run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/nuvem-telegram.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nuvem-telegram-apk
          path: out/nuvem-telegram.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nuvem-backup-tudo
          name: Nuvem 1.8.1 (completa)
          files: out/nuvem-telegram.apk
          prerelease: true
          make_latest: false
